# Convenience wrapper around the Dockerfile.
#
#   docker compose run --rm mutationscan run \
#       --genomes data/genomes --references data/references --out data/output
#
# Your data and config are mounted from the host, so results land in ./data/output
# on your machine and nothing is trapped inside the container.
services:
  mutationscan:
    build:
      context: .
      dockerfile: Dockerfile
    image: mutationscan:latest
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    working_dir: /app
