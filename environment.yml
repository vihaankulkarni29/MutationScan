name: mutationscan
channels:
  - conda-forge
  - bioconda
dependencies:
  # Runtime
  - python>=3.10
  - blast          # supplies tblastn, the only external binary the tool calls
  - pandas>=2.0.0
  - biopython>=1.81
  - pyyaml>=6.0
  - scipy>=1.10     # epistasis: Fisher exact test

  # Workflow engine (optional at runtime; the `mutationscan` CLI needs none of it)
  - snakemake-minimal>=7.32.4

  # Development
  - pip
  - pytest>=7.4
  - ruff>=0.5
  - mypy>=1.0
