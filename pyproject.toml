[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation_scan"
dynamic = ["version"]
description = "Sequence-only pipeline for protein variant calling and descriptive mutation co-occurrence across bacterial genomes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MutationScan" }]
keywords = ["genomics", "bioinformatics", "variant-calling", "tblastn", "co-occurrence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0.0",
    "biopython>=1.81",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
workflow = ["snakemake>=7.32.4"]
plots = ["matplotlib>=3.7.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7.0"]

[project.scripts]
mutationscan = "mutation_scan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mutation_scan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mutation_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:Bio.*"]
