[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation_scan"
dynamic = ["version"]
description = "Sequence-only pipeline for protein variant calling and descriptive mutation co-occurrence across bacterial genomes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MutationScan" }]
keywords = ["genomics", "bioinformatics", "variant-calling", "tblastn", "co-occurrence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0.0",
    "biopython>=1.81",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
workflow = ["snakemake>=7.32.4"]
plots = ["matplotlib>=3.7.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "snakemake>=7.32.4",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14",
    "networkx>=3.0",
]

[project.scripts]
mutationscan = "mutation_scan.cli:main"

[project.urls]
Homepage = "https://github.com/vihaankulkarni29/MutationScan"
Documentation = "https://github.com/vihaankulkarni29/MutationScan#readme"
Repository = "https://github.com/vihaankulkarni29/MutationScan"
"Bug Tracker" = "https://github.com/vihaankulkarni29/MutationScan/issues"

[tool.setuptools.dynamic]
version = { attr = "mutation_scan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mutation_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:Bio.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mutation_scan"]

[tool.mypy]
packages = ["mutation_scan"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
