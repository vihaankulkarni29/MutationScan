# MutationScan run configuration.
#
# Target genes are NOT listed here by default: they are discovered from the
# filenames in references_dir. Drop geneA_WT.faa in there and geneA is a target.
# Nothing about any gene, organism or drug is baked into the code.

job_name: default_run

# Inputs
genomes_dir: data/genomes           # nucleotide assemblies, one *.fna per genome
references_dir: data/references     # wild-type proteins, {gene}_WT.faa or {gene}.faa

# Output: everything is written to {output_root}/{job_name}/
output_root: data/output

# Optional subset of references_dir. [] means "use every reference present".
targets: []

# Optional: NCBI taxonomy ID used to auto-fetch any target whose reference is
# missing from references_dir (e.g. "83333"). "" disables all network access.
uniprot_taxid: ""

# Quality gates applied per (genome, gene) alignment before mutations are called.
min_identity_percent: 80    # identity to the reference over reference length
min_coverage_percent: 80    # fraction of reference positions the query covers

# External binary (BLAST+). Override if tblastn is not on PATH.
tblastn_binary: tblastn

# Parallel tblastn processes during extraction.
threads: 4

# Descriptive co-occurrence: raw counts only, no statistics or scoring.
cooccurrence:
  levels: [gene]      # add "variant" for {gene}:{mutation}-level pairs
  min_count: 1        # drop pairs seen together in fewer than this many genomes
