name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install BLAST+
        # Without this the @requires_tblastn tests skip silently and the unit
        # job goes green having run none of the extraction or batching
        # coverage -- including the guard that -max_target_seqs stays per-query.
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/mutation_scan/

      - name: Unit tests
        # -rs prints the reason for every skip, so the check below can catch the
        # blast-dependent tests having been skipped. A green run that quietly
        # skipped half the suite looks like coverage and is not.
        run: |
          set -o pipefail
          pytest tests/unit/ -q -rs --cov=mutation_scan --cov-report=xml | tee /tmp/unit.txt
          if grep -q "BLAST+ tblastn is not installed" /tmp/unit.txt; then
            echo "::error::BLAST-dependent tests were skipped; unit job is not covering extraction"
            exit 1
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
