name: integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate the Snakemake DAG
        run: snakemake -n --cores 1

      - name: Check the shipped config resolves
        # config-check exits 1 (EXIT_INPUTS_MISSING) when data dirs are absent,
        # which they are in CI. The JSON output proves the config parses and
        # resolves to the expected layout. The Snakemake dry-run + integration
        # tests that follow are what prove the pipeline works end-to-end.
        run: |
          mutationscan config-check --config config/config.yaml --json \
            2>&1 | tee /tmp/config-check.json
          test -s /tmp/config-check.json

      - name: Run integration tests
        run: pytest tests/integration/ -v

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            tests/integration/tmp/
            tests/integration/output/
            **/results/
