name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Every step runs inside the conda environment.
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mutationscan
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Install package
        run: pip install --no-deps -e .

      - name: Check tblastn is available
        run: tblastn -version

      # The whole suite, not just unit/: the integration tests are the ones that
      # prove the CLI and the workflow actually produce the documented outputs.
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate the Snakemake DAG
        # Needs no biological data -- it only proves the workflow compiles and
        # that every rule's paths agree with what Config.outputs() declares.
        run: snakemake -n --cores 1

      - name: Check the shipped config resolves
        run: mutationscan config-check --config config/config.yaml --json
